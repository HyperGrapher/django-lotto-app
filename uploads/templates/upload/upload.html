<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css"
        integrity="sha384-r4NyP46KrjDleawBgD5tp8Y7UzmLA05oM1iAEQ17CSuDqnUK2+k9luXQOfXJCJ4I" crossorigin="anonymous" />
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/js/bootstrap.min.js"
        integrity="sha384-oesi62hOLfzrys4LxRF63OJCXdXDipiYWBnvTl9Y9/TRlw5xlKIEHpNyvvDShgf/" crossorigin="anonymous">
    </script>
    <title>Lotto</title>
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col">
                <h3 style="color: #303030;">Image Upload Template</h3>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input class="btn" type="file" name="image" id="img" />
                    <button class="btn btn-primary" type="submit">UPLOAD</button>
                </form>
                {% if url %}

                <div class="mt-3">
                    <p>{{url}}</p>
                    <img src="{{url}}" alt="lotto" style="max-width: 350px;" />
                </div>

                {% endif %}
            </div>
            <div class="col mt-5">
                <h3 style="color: #303030;">Image Result</h3>

                {% if url %}
                <div class="mt-5">
                    <img class="mt-5" src="{{url}}" alt="lotto" style="max-width: 350px;" />
                </div>

                {% endif %}
            </div>
        </div>
    </div>
</body>

</html>
